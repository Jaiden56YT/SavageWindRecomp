# Builds the app on real Windows (MSYS2 UCRT64, the toolchain docs/BUILD-windows.md and tools/setup_windows.ps1 set up
# on a player's machine): no game code, so no Nintendo data - the same `make` a Windows user runs from an MSYS2 UCRT64
# shell. This is the check a Linux container cannot give: the Windows target's own headers, import libraries and
# windres. Locally (a Linux host) the alternatives are a Windows VM under QEMU or a mingw-w64 cross build, neither of
# which reproduces the MSYS2 setup.
name: Windows

on:
  push:
    branches: [test, main, coop-mods]
  pull_request:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-nasm
      - name: Build
        run: make -j$(nproc) && ls -l build/savagewind.exe build/savagewind.dll.a

  # The co-op installer's windows (tools/install_coop.ps1), drawn on a real Windows: a syntax check of the script,
  # then each window saved as a picture (-Snapshot: drawn, then closed without doing anything). No game files.
  installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\install_coop.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
      - name: Install window
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\install_coop.ps1 -Snapshot "$PWD\install-window.png"
      - name: Update window
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force extracted\exefs, extracted\romfs\Pack | Out-Null
          Set-Content extracted\exefs\main x
          Set-Content extracted\romfs\Pack\Bootup.pack x
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\install_coop.ps1 -Update -Snapshot "$PWD\update-window.png"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\install_coop.ps1 -Snapshot "$PWD\install-window-set-up.png"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: '*.png'
          if-no-files-found: error
